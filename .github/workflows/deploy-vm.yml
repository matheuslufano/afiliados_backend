name: Deploy backend to VM

on:
  workflow_dispatch:

concurrency:
  group: deploy-backend-vm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script_stop: true
          script: |
            set -eu

            APP_ROOT="/home/netbox/afiliados-backend"
            RELEASES_DIR="$APP_ROOT/releases"
            RELEASE="$RELEASES_DIR/${{ github.sha }}"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            # O Docker rootless da VM compartilha a cota de 5 GB do usuario.
            # Limpar o cache antes do clone evita falhas ENOSPC/EDQUOT.
            docker builder prune --all --force

            mkdir -p "$RELEASES_DIR"
            rm -rf "$RELEASE"

            for attempt in 1 2 3; do
              if git clone --depth 1 --branch main "$REPO_URL" "$RELEASE"; then
                break
              fi

              rm -rf "$RELEASE"

              if [ "$attempt" -eq 3 ]; then
                echo "Nao foi possivel clonar o repositorio apos 3 tentativas."
                exit 1
              fi

              sleep 10
            done

            if [ ! -f "$APP_ROOT/current/.env.docker.runtime" ]; then
              echo "Missing $APP_ROOT/current/.env.docker.runtime"
              exit 1
            fi

            cp "$APP_ROOT/current/.env.docker.runtime" "$RELEASE/.env.docker.runtime"

            cd "$RELEASE"

            docker build -t afiliados-backend:${{ github.sha }} .

            docker stop afiliados-backend || true
            docker rm afiliados-backend || true

            docker run -d \
              --name afiliados-backend \
              --restart unless-stopped \
              --network afiliados-net \
              --env-file .env.docker.runtime \
              -p 3001:3001 \
              afiliados-backend:${{ github.sha }}

            ln -sfn "$RELEASE" "$APP_ROOT/current"

            sleep 5
            curl -fsS http://127.0.0.1:3001/health

            docker images afiliados-backend \
              --format '{{.Repository}}:{{.Tag}}' \
              | tail -n +4 \
              | xargs -r docker image rm \
              || true

            ls -1dt "$RELEASES_DIR"/* 2>/dev/null \
              | tail -n +6 \
              | xargs -r rm -rf
